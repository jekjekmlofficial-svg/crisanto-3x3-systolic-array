# Tiny Tapeout project information
project:
  title:        "4-bit 3x3 Systolic Array Matrix Multiplier"
  author:       "CrisantoCPE"
  discord:      ""
  description:  "A signed 4-bit 3x3 output-stationary systolic array matrix multiplier"
  language:     "Verilog"
  clock_hz:     50000000

  # Start with one tile; we will evaluate actual IHP area after GDS.
  tiles: "1x1"

  top_module:  "tt_um_crisanto_systolic"

  source_files:
    - "project.v"

pinout:
  # Inputs
  ui[0]: "DATA[0]"
  ui[1]: "DATA[1]"
  ui[2]: "DATA[2]"
  ui[3]: "DATA[3]"
  ui[4]: "DATA[4]"
  ui[5]: "DATA[5]"
  ui[6]: "DATA[6]"
  ui[7]: "DATA[7]"

  # Outputs
  uo[0]: "RESULT[0]"
  uo[1]: "RESULT[1]"
  uo[2]: "RESULT[2]"
  uo[3]: "RESULT[3]"
  uo[4]: "RESULT[4]"
  uo[5]: "RESULT[5]"
  uo[6]: "RESULT[6]"
  uo[7]: "RESULT[7]"

  # Bidirectional pins
  uio[0]: "START / RESULT[8]"
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
